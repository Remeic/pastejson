<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="description" content="Paste JSON. See it formatted. Instantly. 100% local, nothing leaves your browser." />
    <meta name="color-scheme" content="light dark" />
    <title>pastejson — instant JSON viewer</title>
    <style>
      /* boot critical CSS: styled first paint before JS module evaluates (kills FOUC) */
      :root {
        color-scheme: light dark;
        --mono: ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace;
        --sans: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      }
      @media (prefers-color-scheme: dark) {
        :root { --bg: #0b0e14; --fg: #d6deeb; --muted: #5c6a7e; --line: #1c2532; --panel: #10151d; --accent: #4cc38a; }
      }
      @media (prefers-color-scheme: light) {
        :root { --bg: #ffffff; --fg: #24292f; --muted: #57606a; --line: #eaeef2; --panel: #f6f8fa; --accent: #1a7f37; }
      }
      html { background: var(--bg); }
      body {
        margin: 0; height: 100vh; display: flex; flex-direction: column;
        background: var(--bg); color: var(--fg); font-family: var(--sans); overflow: hidden;
      }
      #brand { padding: 10px 16px; font-family: var(--mono); font-size: 14px; user-select: none; }
      #brand b { color: var(--accent); }
      #landing {
        flex: 1; display: flex; flex-direction: column; align-items: center;
        justify-content: center; gap: 14px; text-align: center; cursor: copy;
      }
      #landing h1 { margin: 0; font-size: clamp(28px, 6vw, 52px); line-height: 1.12; font-weight: 700; letter-spacing: -0.02em; }
      .hint { margin: 0; color: var(--muted); font-size: 16px; }
      .hint kbd { font-family: var(--mono); background: var(--panel); border: 1px solid var(--line); border-bottom-width: 2px; border-radius: 5px; padding: 1px 6px; font-size: 13px; }
      .sub { margin: 0; color: var(--muted); font-size: 12px; opacity: 0.75; }
      .claim {
        margin: 0; font-family: var(--mono); font-size: 12px; color: var(--accent);
        border: 1px solid color-mix(in srgb, var(--accent) 40%, var(--line));
        background: color-mix(in srgb, var(--accent) 8%, var(--bg));
        padding: 5px 14px; border-radius: 999px; letter-spacing: 0.02em;
      }
      [hidden] { display: none !important; }
    </style>
  </head>
  <body data-mode="landing">
    <div id="brand"><b>paste</b>json</div>

    <div id="toolbar" hidden>
      <button id="btn-new" title="Clear (Esc)">＋ New</button>
      <div class="seg" role="tablist" aria-label="View">
        <button data-view="text" class="on">Text</button>
        <button data-view="tree">Tree</button>
        <button data-view="min">Minified</button>
      </div>
      <label class="indent-label">indent
        <select id="sel-indent" aria-label="Indent size">
          <option value="2" selected>2</option>
          <option value="4">4</option>
          <option value="tab">Tab</option>
        </select>
      </label>
      <span class="spacer"></span>
      <button id="btn-copyp">Copy formatted</button>
      <button id="btn-copym">Copy minified</button>
    </div>

    <div id="statusbar"></div>
    <div id="errbanner" hidden></div>

    <section id="landing">
      <p class="claim">⚡ the fastest JSON viewer — multi-MB files in milliseconds</p>
      <h1>Paste JSON.<br />See it formatted.</h1>
      <p class="hint"><kbd>⌘V</kbd> / <kbd>Ctrl+V</kbd> anywhere &nbsp;·&nbsp; or drop a .json file</p>
      <p class="sub">100% local — your data never leaves the browser</p>
    </section>

    <textarea
      id="in"
      autofocus
      spellcheck="false"
      autocomplete="off"
      autocapitalize="off"
      aria-label="JSON input"
    ></textarea>

    <main id="out" hidden>
      <pre id="rawprev" hidden></pre>
      <div id="view"></div>
    </main>

    <div id="toast" role="status"></div>
    <div id="drop-overlay" hidden>Drop JSON file…</div>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
